name: Spread Monitor Ping
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
jobs:
  call-cron-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel /api/cron
        run: |
          curl -fsS --retry 2 --connect-timeout 15 --max-time 90 \
            "${{ secrets.CRON_URL }}?secret=${{ secrets.CRON_SECRET }}"
